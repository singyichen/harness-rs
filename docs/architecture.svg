<svg xmlns="http://www.w3.org/2000/svg" width="880" height="770" viewBox="0 0 880 770" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .mono { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
    .title { font-size: 12px; font-weight: 700; letter-spacing: .08em; fill: #26221F; }
    .sub { font-size: 11px; fill: #6B6259; font-weight: 400; letter-spacing: 0; }
    .name { font-size: 12.5px; font-weight: 600; fill: #26221F; }
    .desc { font-size: 11px; fill: #6B6259; }
    .pill { font-size: 11.5px; fill: #C2532B; }
  </style>

  <rect x="0" y="0" width="880" height="770" fill="#F6F4F2"/>

  <!-- Band 1: Claude Code session -->
  <rect x="20" y="16" width="840" height="150" rx="10" fill="#FFFFFF" stroke="#DDD6D0"/>
  <text x="36" y="42" class="mono title">CLAUDE CODE SESSION <tspan class="sub">— every event calls harness</tspan></text>

  <rect x="32" y="56" width="192" height="94" rx="8" fill="#F6F4F2" stroke="#DDD6D0"/>
  <text x="44" y="78" class="mono name">SessionStart</text>
  <text x="44" y="98" class="desc">Injects the behavior protocol</text>
  <text x="44" y="114" class="desc">and the active gate modes</text>

  <rect x="236" y="56" width="192" height="94" rx="8" fill="#F6F4F2" stroke="#DDD6D0"/>
  <text x="248" y="78" class="mono name">UserPromptSubmit</text>
  <text x="248" y="98" class="desc">One-line discipline nudge</text>
  <text x="248" y="114" class="desc">on every message</text>

  <rect x="440" y="56" width="192" height="94" rx="8" fill="#F6F4F2" stroke="#DDD6D0"/>
  <text x="452" y="78" class="mono name">PostToolUse</text>
  <text x="452" y="98" class="desc">Records code edits and test</text>
  <text x="452" y="114" class="desc">runs (Edit / Write / Bash)</text>

  <rect x="644" y="56" width="192" height="94" rx="8" fill="#F6F4F2" stroke="#DDD6D0"/>
  <text x="656" y="78" class="mono name">Stop</text>
  <text x="656" y="98" class="desc">Verify gate: code changed but</text>
  <text x="656" y="114" class="desc">untested → block or warn</text>

  <!-- Arrow 1 -->
  <line x1="440" y1="166" x2="440" y2="174" stroke="#C2532B" stroke-width="1.5"/>
  <rect x="290" y="176" width="300" height="22" rx="11" fill="#C2532B" opacity="0.1"/>
  <text x="440" y="191" text-anchor="middle" class="mono pill">harness hook &lt;event&gt; · stdin JSON</text>
  <line x1="440" y1="200" x2="440" y2="206" stroke="#C2532B" stroke-width="1.5"/>
  <polygon points="434,206 446,206 440,214" fill="#C2532B"/>

  <!-- Band 2: the binary -->
  <rect x="20" y="214" width="840" height="150" rx="10" fill="#FFFFFF" stroke="#C2532B" stroke-width="1.5"/>
  <text x="36" y="240" class="mono title" fill="#C2532B">HARNESS — SINGLE RUST BINARY <tspan class="sub">— fail-open: any internal error allows the action, never breaks your session</tspan></text>

  <rect x="32" y="254" width="260" height="94" rx="8" fill="#FFFFFF" stroke="#DDD6D0"/>
  <text x="44" y="276" class="mono name">Hook engine</text>
  <text x="44" y="296" class="desc">Dispatches the four events;</text>
  <text x="44" y="312" class="desc">panics caught, silenced, exit 0</text>

  <rect x="306" y="254" width="260" height="94" rx="8" fill="#FFFFFF" stroke="#DDD6D0"/>
  <text x="318" y="276" class="mono name">Layered config</text>
  <text x="318" y="296" class="desc">built-in → global config.toml →</text>
  <text x="318" y="312" class="desc">project harness.toml (nearest wins)</text>

  <rect x="580" y="254" width="260" height="94" rx="8" fill="#FFFFFF" stroke="#DDD6D0"/>
  <text x="592" y="276" class="mono name">Session state</text>
  <text x="592" y="296" class="desc">Sequence-tracks last code change vs</text>
  <text x="592" y="312" class="desc">last test; a test run clears the list</text>

  <!-- Arrow 2 -->
  <line x1="440" y1="364" x2="440" y2="372" stroke="#C2532B" stroke-width="1.5"/>
  <rect x="230" y="374" width="420" height="22" rx="11" fill="#C2532B" opacity="0.1"/>
  <text x="440" y="389" text-anchor="middle" class="mono pill">install / update / uninstall · SHA-256 manifest guards your customizations</text>
  <line x1="440" y1="398" x2="440" y2="404" stroke="#C2532B" stroke-width="1.5"/>
  <polygon points="434,404 446,404 440,412" fill="#C2532B"/>

  <!-- Band 3: released assets -->
  <rect x="20" y="412" width="840" height="160" rx="10" fill="#FFFFFF" stroke="#DDD6D0"/>
  <text x="36" y="438" class="mono title">~/.claude/ RELEASED ASSETS <tspan class="sub">— files you have modified are never overwritten</tspan></text>

  <rect x="32" y="452" width="260" height="104" rx="8" fill="#F6F4F2" stroke="#DDD6D0"/>
  <text x="44" y="474" class="mono name">harness/protocol.md</text>
  <text x="44" y="494" class="desc">The behavior protocol itself,</text>
  <text x="44" y="510" class="desc">injected whole at SessionStart</text>

  <rect x="306" y="452" width="260" height="104" rx="8" fill="#F6F4F2" stroke="#DDD6D0"/>
  <text x="318" y="474" class="mono name">skills/adversarial-review</text>
  <text x="318" y="494" class="desc">Opposition panel reviews in parallel;</text>
  <text x="318" y="510" class="desc">a majority must survive</text>

  <rect x="580" y="452" width="260" height="104" rx="8" fill="#F6F4F2" stroke="#DDD6D0"/>
  <text x="592" y="474" class="mono name">agents/ — five lenses</text>
  <!-- chips row 1 (default panel, accent) -->
  <rect x="592" y="484" width="62" height="18" rx="9" fill="#C2532B" opacity="0.1"/>
  <text x="623" y="497" text-anchor="middle" class="mono" font-size="10.5" fill="#C2532B">skeptic</text>
  <rect x="660" y="484" width="68" height="18" rx="9" fill="#C2532B" opacity="0.1"/>
  <text x="694" y="497" text-anchor="middle" class="mono" font-size="10.5" fill="#C2532B">red-team</text>
  <rect x="734" y="484" width="80" height="18" rx="9" fill="#C2532B" opacity="0.1"/>
  <text x="774" y="497" text-anchor="middle" class="mono" font-size="10.5" fill="#C2532B">simplifier</text>
  <!-- chips row 2 -->
  <rect x="592" y="508" width="118" height="18" rx="9" fill="none" stroke="#DDD6D0"/>
  <text x="651" y="521" text-anchor="middle" class="mono" font-size="10.5" fill="#6B6259">evidence-auditor</text>
  <rect x="716" y="508" width="100" height="18" rx="9" fill="none" stroke="#DDD6D0"/>
  <text x="766" y="521" text-anchor="middle" class="mono" font-size="10.5" fill="#6B6259">user-advocate</text>
  <text x="592" y="546" class="desc">tinted = default panel; set via [review].panel</text>

  <!-- Verify gate strip -->
  <text x="20" y="612" class="mono" font-size="14" font-weight="700" fill="#26221F">Verify gate (Stop hook)</text>

  <rect x="20" y="628" width="170" height="56" rx="8" fill="#FFFFFF" stroke="#DDD6D0"/>
  <text x="34" y="650" class="name" font-size="12.5">Code changed</text>
  <text x="34" y="670" class="desc" font-size="10.5">code_globs hit, not exempt</text>

  <text x="200" y="660" class="desc" font-size="13">→</text>

  <rect x="222" y="628" width="186" height="56" rx="8" fill="#FFFFFF" stroke="#DDD6D0"/>
  <text x="236" y="650" class="name" font-size="12.5">Test run afterwards?</text>
  <text x="236" y="670" class="desc" font-size="10.5">test_commands substring match</text>

  <text x="418" y="660" class="desc" font-size="12">→ no →</text>

  <!-- gate modes -->
  <rect x="482" y="622" width="378" height="26" rx="8" fill="#FFFFFF" stroke="#DDD6D0"/>
  <rect x="482" y="622" width="4" height="26" rx="2" fill="#B3372E"/>
  <text x="496" y="639" class="mono" font-size="11" font-weight="700" fill="#B3372E">strict</text>
  <text x="556" y="639" class="desc" font-size="10.5">blocks once, names files; explain → 2nd stop passes</text>

  <rect x="482" y="654" width="378" height="26" rx="8" fill="#FFFFFF" stroke="#DDD6D0"/>
  <rect x="482" y="654" width="4" height="26" rx="2" fill="#9A6B0F"/>
  <text x="496" y="671" class="mono" font-size="11" font-weight="700" fill="#9A6B0F">advisory</text>
  <text x="556" y="671" class="desc" font-size="10.5">default: warns but allows</text>

  <rect x="482" y="686" width="378" height="26" rx="8" fill="#FFFFFF" stroke="#DDD6D0"/>
  <rect x="482" y="686" width="4" height="26" rx="2" fill="#7A756F"/>
  <text x="496" y="703" class="mono" font-size="11" font-weight="700" fill="#7A756F">off</text>
  <text x="556" y="703" class="desc" font-size="10.5">no check</text>

  <!-- footer -->
  <line x1="20" y1="732" x2="860" y2="732" stroke="#DDD6D0"/>
  <text x="20" y="754" class="desc" font-size="11">Lifecycle install · doctor · update · uninstall · init · config&#160;&#160;&#160;&#160;Safety timestamped backups · atomic writes · append-only&#160;&#160;&#160;&#160;Tests 50 unit + 9 integration/E2E</text>
</svg>
